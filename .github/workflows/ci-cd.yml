name: CI/CD - Microservicios Kubernetes
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: deployment-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compilar y ejecutar pruebas Maven
        run: mvn -B --no-transfer-progress clean verify
      - name: Validar contratos Postman y migraciones
        run: python3 scripts/validate-project.py

  build-push:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api-gateway, auth-service, user-service, product-service, payment-service]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Autenticación GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Normalizar propietario GHCR
        id: meta
        shell: bash
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - name: Publicar imagen SHA y main
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/${{ matrix.service }}:${{ github.sha }}
            ghcr.io/${{ steps.meta.outputs.owner }}/${{ matrix.service }}:main

  deploy-local:
    needs: build-push
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: [self-hosted, Windows, X64, docker-desktop]
    permissions:
      contents: read
      packages: read
    timeout-minutes: 30
    steps:
      - name: Obtener scripts de despliegue
        uses: actions/checkout@v4
      - name: Comprobar conectividad con Kubernetes
        shell: pwsh
        run: |
          kubectl config current-context
          kubectl get nodes
          if ($LASTEXITCODE -ne 0) { throw 'No hay acceso al clúster Kubernetes' }
      - name: Actualizar imágenes GHCR en Docker Desktop Kubernetes
        shell: pwsh
        env:
          IMAGE_OWNER: ${{ github.repository_owner }}
          IMAGE_SHA: ${{ github.sha }}
        run: ./scripts/deploy-local.ps1
      - name: Resumen del despliegue
        if: always()
        shell: pwsh
        run: |
          kubectl -n proyecto-03 get deployments,pods -o wide
          kubectl -n proyecto-03 get events --sort-by=.lastTimestamp --field-selector type=Warning

